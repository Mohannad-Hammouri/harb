<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#a9733f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>حرب الحبر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Marhey:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: لعبة ولاد على ورقة دفتر — مرحة، قلم حبر، شخابيط
IDEA: ورقة دفتر على طاولة خشب، وكل الأزرار قصاصات ورق وأوراق لاصقة
PICTURE: الورقة نفسها هي ساحة المعركة
COLOUR and TYPE: خشب دافي، ورق كريمي، حبر كحلي؛ خط Marhey للعناوين و Baloo Bhaijaan 2 للنص
LAYOUT: الشاشة الكبيرة: لوحة فوق + الورقة بالنص؛ الجوال بالعرض: عمودين جانبيين والورقة بالنص
*/
:root {
  --wood1: #c18a55; --wood2: #a9733f; --wood3: #8d5c2f;
  --paper: #fbf7ea; --paper2: #f3ecd8; --ink: #1d2d50; --ink2: #3b4a6b;
  --pencil: #f5c542; --pencil2: #e0a92a; --red: #c62828; --green: #13804a;
  --note: #fff3a6; --note2: #ffe680;
  --hand: Marhey, "Baloo Bhaijaan 2", "Segoe UI", Tahoma, sans-serif;
  --body: "Baloo Bhaijaan 2", Marhey, "Segoe UI", Tahoma, sans-serif;
  --r-hand: 255px 15px 225px 15px / 15px 225px 15px 255px;
  --r-hand2: 15px 255px 15px 225px / 225px 15px 255px 15px;
  color-scheme: light;
}
* { box-sizing: border-box; min-width: 0; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font: 17px/1.5 var(--body); color: var(--ink);
  background:
    repeating-linear-gradient(92deg, rgba(0,0,0,0) 0 38px, rgba(90,50,20,.07) 38px 40px, rgba(0,0,0,0) 40px 97px, rgba(255,230,190,.06) 97px 99px),
    repeating-linear-gradient(88deg, var(--wood1) 0 180px, var(--wood2) 180px 330px, #b67d47 330px 520px),
    var(--wood1);
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.hand { font-family: var(--hand); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* أزرار مرسومة باليد */
.btn {
  font-family: var(--hand); font-weight: 600; font-size: 1.05em; cursor: pointer;
  background: #fffdf5; color: var(--ink); border: 2.5px solid var(--ink); border-radius: var(--r-hand);
  padding: .45em 1.15em; min-height: 44px; box-shadow: 3px 4px 0 rgba(40,25,10,.28);
  transition: transform .12s, box-shadow .12s; transform: rotate(-.6deg);
}
.btn:nth-child(2n) { border-radius: var(--r-hand2); transform: rotate(.5deg); }
.btn:active { transform: translate(2px,3px) rotate(0); box-shadow: 1px 1px 0 rgba(40,25,10,.28); }
.btn:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
.btn.yel { background: var(--pencil); }
.btn.big { font-size: 1.45em; padding: .5em 1.5em; }
.btn.sm { font-size: .9em; padding: .25em .8em; min-height: 36px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.on { background: var(--ink); color: #fffdf5; }

/* ورقة ومذكرة لاصقة */
.sheet {
  background: var(--paper);
  background-image: linear-gradient(rgba(110,155,214,.33) 1.5px, transparent 1.5px), linear-gradient(90deg, transparent 54px, rgba(226,112,112,.5) 54px, rgba(226,112,112,.5) 56px, transparent 56px);
  background-size: 100% 34px, 100% 100%; background-position: 0 22px, 0 0;
  box-shadow: 0 2px 0 rgba(0,0,0,.08), 0 14px 30px rgba(50,25,5,.35);
  border-radius: 3px;
}
.note {
  background: var(--note); box-shadow: 0 10px 18px rgba(50,25,5,.32); border-radius: 2px 2px 14px 2px;
  padding: 14px 16px; position: relative;
}
.note::before { content: ""; position: absolute; top: -11px; left: 50%; width: 84px; height: 22px; margin-left: -42px; background: rgba(255,255,255,.55); box-shadow: 0 1px 2px rgba(0,0,0,.15); transform: rotate(-3deg); }

/* ===== البداية ===== */
.home { flex: 1; display: grid; place-items: center; padding: 18px; }
.home .sheet { width: min(760px, 94vw); padding: 26px 34px 30px 70px; text-align: center; transform: rotate(-.8deg); position: relative; }
.logo { font-family: var(--hand); font-weight: 700; font-size: clamp(54px, 11vw, 104px); line-height: 1.05; margin: 6px 0 2px; color: var(--ink); position: relative; display: inline-block; }
.logo .splat { position: absolute; z-index: -1; inset: -12% -18%; }
.tag { font-family: var(--hand); font-size: clamp(17px, 2.6vw, 22px); color: var(--ink2); margin: 0 0 18px; }
.home .row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.home .doodles { display: flex; justify-content: space-between; align-items: end; margin: 2px 0 10px; height: 74px; }
.home .doodles img { height: 100%; }
.small { font-size: 14px; color: var(--ink2); }
.resume { margin-top: 14px; }

/* ===== اللوبي ===== */
.lobby { flex: 1; align-content: center; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr); gap: clamp(14px, 2.4vw, 34px); padding: clamp(14px, 3vh, 34px) clamp(14px, 3vw, 44px); align-items: start; overflow: auto; }
.lobby h2 { font-family: var(--hand); font-weight: 700; margin: 0 0 6px; font-size: clamp(22px, 2.4vw, 34px); }
.joinbox { text-align: center; transform: rotate(-1.5deg); }
.joinbox .code { font-family: var(--hand); font-weight: 700; font-size: clamp(46px, 6vw, 84px); letter-spacing: .12em; direction: ltr; line-height: 1.1; }
.joinbox .qr { background: #fff; padding: 10px; border-radius: 8px; display: inline-block; margin: 8px 0 4px; }
.joinbox .qr img, .joinbox .qr canvas { width: clamp(150px, 15vw, 230px); height: auto; display: block; image-rendering: pixelated; }
.players { padding: 18px 22px 22px 66px; min-height: 52vh; transform: rotate(.4deg); }
.players .teams { display: grid; grid-template-columns: 1fr; gap: 10px; }
.players .teams.two { grid-template-columns: 1fr 1fr; }
.players .tcol h3 { font-family: var(--hand); margin: 0 0 4px; font-size: 1.1em; }
.prow { display: flex; align-items: center; gap: 10px; padding: 6px 4px; min-height: 52px; border-bottom: 1.5px dashed rgba(29,45,80,.18); animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
.prow img { width: 38px; height: 38px; }
.prow .nm { font-family: var(--hand); font-weight: 600; font-size: 1.25em; flex: 1; }
.prow .dot { width: 10px; height: 10px; border-radius: 50%; background: #3a9a5b; flex: none; }
.prow .dot.off { background: #c0392b; }
.prow .x { border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--ink2); min-width: 40px; min-height: 40px; }
.empty { font-family: var(--hand); color: rgba(29,45,80,.45); padding: 10px 4px; font-size: 1.15em; }
.settings { display: flex; flex-direction: column; gap: 16px; }
.settings .note { transform: rotate(1.2deg); }
.settings .note:nth-child(2) { transform: rotate(-1deg); background: #c9f0d6; }
.settings .note:nth-child(3) { transform: rotate(.8deg); background: #ffd6d6; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.lbl { font-family: var(--hand); font-weight: 600; margin: 0 0 8px; font-size: 1.05em; }
.go { width: 100%; }
.warn { color: var(--red); font-family: var(--hand); font-size: .95em; margin: 6px 0 0; }
.conn { position: fixed; bottom: 10px; left: 12px; font-size: 13px; color: #fff; background: rgba(0,0,0,.35); padding: 3px 10px; border-radius: 12px; z-index: 50; }
.conn.bad { background: #b3261e; }

@keyframes pop { from { transform: scale(.6) rotate(-6deg); opacity: 0; } }

/* ===== الشاشة الكبيرة أثناء اللعب ===== */
.game { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.hud { direction: ltr; height: clamp(78px, 12.5vh, 132px); display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr); gap: 1.2vw; padding: 1vh 2vw 0; align-items: center; }
.hud .side { direction: rtl; display: flex; gap: 1vw; align-items: center; }
.hud .side.l { justify-content: flex-end; }
.hud .side.r { justify-content: flex-start; }
.hud .mid { direction: rtl; }
.pcard {
  position: relative; background: var(--paper); border-radius: 3px; padding: .45vh 1vw .6vh; min-width: 0; flex: 0 1 auto;
  box-shadow: 0 6px 14px rgba(50,25,5,.32); border-top: 5px solid var(--c); display: grid; grid-template-columns: auto auto; column-gap: .8vw; align-items: center;
  transform: rotate(-1deg); transition: transform .3s, box-shadow .3s;
}
.pcard:nth-child(2) { transform: rotate(1.2deg); }
.pcard.now { transform: translateY(4px) scale(1.06) rotate(0); box-shadow: 0 0 0 3px var(--c), 0 10px 24px rgba(50,25,5,.4); }
.pcard.out { opacity: .45; filter: grayscale(.7); }
.pcard .nm { font-family: var(--hand); font-weight: 700; color: var(--c); font-size: clamp(16px, 1.7vw, 30px); line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 14vw; }
.pcard .us { display: flex; gap: .3vw; align-items: center; font-family: var(--hand); font-size: clamp(12px, 1.05vw, 19px); color: var(--ink2); grid-column: 1; flex-wrap: wrap; }
.pcard .us img { height: clamp(16px, 1.7vw, 30px); }
.pcard .us span { margin-inline-end: .3vw; }
.pcard .bottle { grid-row: 1 / span 2; grid-column: 2; width: clamp(26px, 2.4vw, 44px); }
.pcard .pw { position: absolute; top: -10px; left: -10px; background: var(--pencil); color: var(--ink); border: 2px solid var(--ink); border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; font-family: var(--hand); font-weight: 700; font-size: 15px; }
.pcard .off { position: absolute; bottom: -9px; inset-inline-start: 8px; font-size: 12px; background: #b3261e; color: #fff; padding: 0 6px; border-radius: 8px; }
.mid { text-align: center; position: relative; }
.turnlbl { font-family: var(--hand); font-weight: 700; font-size: clamp(18px, 2vw, 34px); color: #fffdf5; text-shadow: 0 2px 0 rgba(0,0,0,.35); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pencil { height: clamp(18px, 2.2vh, 26px); margin: .6vh auto 0; width: 92%; position: relative; }
.pencil svg { position: absolute; top: 0; height: 100%; right: 0; transition: width .25s linear; overflow: visible; }
.evchip { display: inline-flex; gap: 6px; align-items: center; margin-top: .6vh; background: rgba(255,253,245,.92); padding: 0 12px; border-radius: 14px; font-family: var(--hand); font-size: clamp(13px, 1.1vw, 19px); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.evchip.soon { background: rgba(255,243,166,.95); }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; padding: 1.2vh 1vw 1.6vh; }
.pwrap { position: relative; perspective: 2600px; }
.pwrap canvas.pc { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pwrap .shq { position: absolute; box-shadow: 0 16px 34px rgba(40,20,5,.42), 0 3px 0 rgba(0,0,0,.08); background: transparent; transition: opacity .2s; }
.flap { position: absolute; transform-style: preserve-3d; z-index: 5; will-change: transform; }
.flap canvas, .flap .shade { position: absolute; inset: 0; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flap .shade { pointer-events: none; opacity: 0; }
.fxl { position: absolute; inset: 0; pointer-events: none; z-index: 8; overflow: visible; }
.float { position: absolute; transform: translate(-50%,-50%); font-family: var(--hand); font-weight: 700; white-space: nowrap; animation: floatUp 1.6s ease-out forwards; text-shadow: 0 2px 0 #fffdf5, 0 -2px 0 #fffdf5, 2px 0 0 #fffdf5, -2px 0 0 #fffdf5; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%,-30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-60%) scale(1.1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-150%) scale(1); } }
.shake { animation: shake .35s linear; }
@keyframes shake { 20% { transform: translate(-6px,3px) rotate(-.3deg); } 40% { transform: translate(5px,-4px); } 60% { transform: translate(-4px,2px) rotate(.2deg); } 80% { transform: translate(3px,-2px); } }
.banner { position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%) rotate(-2deg); z-index: 30; pointer-events: none; text-align: center; }
.banner .in { font-family: var(--hand); font-weight: 700; font-size: clamp(30px, 5vw, 88px); line-height: 1.15; background: var(--paper); padding: .15em .8em .25em; border-radius: 4px; box-shadow: 0 16px 40px rgba(40,20,5,.45); color: var(--c, var(--ink)); white-space: nowrap; }
.banner .sub { display: block; font-size: .38em; color: var(--ink2); font-weight: 600; }
.banner.show { animation: bannerIn 2.3s cubic-bezier(.2,1.3,.4,1) forwards; }
@keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.4) rotate(-14deg); } 14% { opacity: 1; transform: translate(-50%,-50%) scale(1.06) rotate(-2deg); } 22% { transform: translate(-50%,-50%) scale(1) rotate(-2deg); } 82% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-62%) scale(.95) rotate(-2deg); } }
.comm { direction: ltr; position: absolute; left: 1.2vw; bottom: 1.2vh; z-index: 20; display: flex; align-items: flex-end; gap: 6px; pointer-events: none; }
.comm svg { width: clamp(54px, 5.4vw, 96px); height: auto; filter: drop-shadow(0 6px 8px rgba(40,20,5,.4)); transform-origin: 50% 90%; }
.comm.talk svg { animation: bob .32s ease-in-out 4 alternate; }
@keyframes bob { to { transform: rotate(-5deg) translateY(-3px); } }
.bubble { direction: rtl; background: #fffdf5; border: 2.5px solid var(--ink); border-radius: var(--r-hand); padding: .3em .9em .4em; font-family: var(--hand); font-weight: 600; font-size: clamp(16px, 1.6vw, 30px); margin-bottom: clamp(30px, 3.5vw, 64px); max-width: 34vw; box-shadow: 3px 4px 0 rgba(40,25,10,.25); opacity: 0; transform: scale(.7); transform-origin: 0 100%; transition: opacity .2s, transform .25s cubic-bezier(.2,1.5,.4,1); }
.comm.talk .bubble { opacity: 1; transform: scale(1); }
.tools { position: absolute; right: 1vw; bottom: 1.2vh; z-index: 20; display: flex; gap: 8px; }
.tools .btn { min-height: 40px; padding: .2em .55em; font-size: 15px; }
.overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(40,22,8,.55); animation: fadeIn .4s; padding: 2vh 2vw; }
@keyframes fadeIn { from { opacity: 0; } }
.over { width: min(1180px, 96vw); max-height: 96vh; overflow: auto; padding: 2.2vh 2.4vw 2.6vh 5vw; display: grid; grid-template-columns: minmax(0,1.2fr) minmax(0,1fr); gap: 2.2vw; align-items: center; transform: rotate(-.6deg); }
.over h1 { font-family: var(--hand); font-weight: 700; font-size: clamp(34px, 4.6vw, 72px); margin: 0; line-height: 1.1; }
.over .frame { background: #fff; padding: 10px; box-shadow: 0 10px 26px rgba(40,20,5,.35); transform: rotate(1.2deg); border: 8px solid #6b4a2a; }
.over .frame img { width: 100%; display: block; }
.over .cap { font-family: var(--hand); text-align: center; margin-top: 6px; color: var(--ink2); }
.awards { display: grid; gap: 8px; margin: 12px 0 16px; }
.award { display: flex; gap: 10px; align-items: center; background: rgba(255,243,166,.7); padding: 6px 12px; border-radius: 4px; font-size: clamp(14px, 1.3vw, 21px); }
.award b { font-family: var(--hand); }
.award .who { font-family: var(--hand); font-weight: 700; margin-inline-start: auto; }

/* ===== الجوال ===== */
.ph { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.ph-center { flex: 1; display: grid; place-items: center; padding: 14px; overflow: auto; }
.ph-card { width: min(440px, 94vw); padding: 18px 22px 22px 54px; }
.ph-card h1 { font-family: var(--hand); font-size: 30px; margin: 0 0 6px; }
.field { display: block; margin: 10px 0 4px; font-family: var(--hand); font-weight: 600; }
.inp { width: 100%; font: 600 20px var(--hand); padding: 8px 12px; border: 2.5px solid var(--ink); border-radius: var(--r-hand2); background: #fffdf5; color: var(--ink); min-height: 48px; }
.inp.code { letter-spacing: .3em; text-align: center; direction: ltr; text-transform: uppercase; font-size: 26px; }
.inks { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
.inkb { width: 46px; height: 46px; border-radius: 50%; border: 3px solid #fffdf5; box-shadow: 0 0 0 2px rgba(0,0,0,.2); cursor: pointer; position: relative; }
.inkb.sel { box-shadow: 0 0 0 3px var(--ink); transform: scale(1.12); }
.inkb[disabled] { opacity: .25; cursor: default; }
.err { color: var(--red); font-family: var(--hand); margin: 6px 0; }
.wait-doodle { width: 120px; margin: 4px auto; display: block; }
.rotate { position: fixed; inset: 0; z-index: 90; background: var(--wood2); display: none; place-items: center; text-align: center; color: #fffdf5; font-family: var(--hand); font-size: 24px; padding: 20px; }
.rotate .ph-icon { font-size: 64px; display: block; animation: rot 1.6s ease-in-out infinite; }
@keyframes rot { 50% { transform: rotate(-90deg); } }
@media (orientation: portrait) { body.needland .rotate { display: grid; } }

/* بناء الجيش */
.army { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px 18px; padding: 8px 14px 10px; align-content: start; overflow: auto; }
.army-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
.army-top h1 { font-family: var(--hand); font-size: 24px; margin: 0; white-space: nowrap; }
.budget { flex: 1; height: 26px; background: rgba(255,253,245,.85); border: 2px solid var(--ink); border-radius: var(--r-hand); position: relative; overflow: hidden; }
.budget i { position: absolute; inset: 0 auto 0 0; background: var(--c); opacity: .75; transition: width .25s; }
.budget b { position: relative; display: block; text-align: center; font-family: var(--hand); line-height: 22px; }
.urow { display: flex; align-items: center; gap: 8px; background: var(--paper); padding: 6px 10px; border-radius: 3px; box-shadow: 0 4px 10px rgba(50,25,5,.28); min-height: 64px; }
.urow img { width: 52px; height: 46px; object-fit: contain; flex: none; }
.urow .t { flex: 1; line-height: 1.2; }
.urow .t b { font-family: var(--hand); font-size: 17px; display: block; }
.urow .t small { font-size: 12.5px; color: var(--ink2); }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ink); background: #fffdf5; font: 700 22px var(--hand); line-height: 1; cursor: pointer; display: grid; place-items: center; }
.step button[disabled] { opacity: .3; }
.step span { min-width: 26px; text-align: center; font: 700 22px var(--hand); }
.army-bot { grid-column: 1 / -1; display: flex; gap: 10px; justify-content: center; align-items: center; }

/* ساحة الجوال بالعرض */
.pb { flex: 1; display: grid; grid-template-columns: var(--sideL, 100px) minmax(0,1fr) var(--sideR, 112px); min-height: 0; gap: 6px; padding: 4px max(6px, env(safe-area-inset-right)) 4px max(6px, env(safe-area-inset-left)); direction: ltr; }
.pb > * { min-height: 0; }
.pb-mid { display: flex; flex-direction: column; min-height: 0; align-items: center; }
.pb-msg { height: 28px; flex: none; font-family: var(--hand); font-weight: 700; font-size: 17px; color: #fffdf5; text-shadow: 0 1px 0 rgba(0,0,0,.4); direction: rtl; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; line-height: 28px; }
.pb-msg.mine { color: var(--pencil); }
.pb-paper { position: relative; flex: 1; width: 100%; min-height: 0; display: grid; place-items: center; }
.cvw { position: relative; line-height: 0; }
.pb-paper canvas { display: block; touch-action: none; box-shadow: 0 8px 18px rgba(40,20,5,.38); border-radius: 2px; }
.pb-side { display: flex; flex-direction: column; gap: 6px; direction: rtl; overflow-y: auto; overflow-x: hidden; padding: 2px 0; }
.pb-side .me { font-family: var(--hand); font-weight: 700; color: #fffdf5; text-shadow: 0 1px 0 rgba(0,0,0,.4); font-size: 15px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-side .bottle { width: 44px; margin: 0 auto; display: block; }
.tbtn { display: flex; align-items: center; gap: 4px; background: var(--paper); border: 2px solid transparent; border-radius: 6px; padding: 2px 4px; min-height: 44px; cursor: pointer; font-family: var(--hand); font-size: 13px; color: var(--ink); box-shadow: 0 3px 6px rgba(40,20,5,.3); width: 100%; justify-content: space-between; }
.tbtn img { height: 32px; width: 40px; object-fit: contain; }
.tbtn.sel { border-color: var(--ink); background: #fff8d0; }
.tbtn[disabled] { opacity: .5; }
.tbtn .cd { font-weight: 700; font-size: 15px; }

<script>
{
/* ================= قواعد اللعبة (بتشتغل على الشاشة الكبيرة، والجوال بيستخدمها للتحقق) ================= */
const PW = 1600, PH = 1000;
const UT = {
  s: { n: 'جندي', cost: 5, max: 8, r: 22, mv: 120, rg: 175, cd0: 0, cd: 0, att: 1, blot: { k: 'o', r: 24 }, desc: 'بيضرب كل دور • نقطة صغيرة' },
  t: { n: 'دبابة', cost: 20, max: 2, r: 38, mv: 70, rg: 250, cd0: 2, cd: 3, att: 1, blot: { k: 'o', r: 50 }, desc: 'كل ٣ أدوار • بقعة كبيرة' },
  p: { n: 'طيارة', cost: 30, max: 1, r: 34, mv: 0, auto: 85, rg: 0, cd0: 3, cd: 4, att: 1, blot: { k: 'l', r: 16, len: 320 }, desc: 'كل ٤ أدوار • خط بأي مكان • بتطير لحالها' },
  a: { n: 'مدفعية', cost: 25, max: 2, r: 34, mv: 0, rg: 230, cd0: 1, cd: 2, att: 1, blot: { k: 'o2', r: 36 }, desc: 'كل دورين • بقعتين • ما بتتحرك' },
  m: { n: 'مسعف', cost: 15, max: 1, r: 22, mv: 120, rg: 0, cd0: 3, cd: 3, att: 0, desc: 'كل ٣ أدوار بيرجّع جندي ميت جنبه' },
};
const UORDER = ['s', 't', 'p', 'a', 'm'];
const BUDGET = { '1v1': 100, '2v2': 70 };
const POW = {
  nuke: { n: 'قنبلة نووية', d: 'بقعة ضخمة بأرض العدو بعد ٣ أدوار' },
  rain: { n: 'مطر حبر', d: '١٠ نقط عشوائية على أرض العدو' },
  flip: { n: 'قلب الورقة', d: 'ضربة العدو الجاية بترجع عليه' },
  dome: { n: 'قبة حماية', d: 'دائرة بأرضك ما بينطبع فيها حبر لدورين' },
};
const POWS = ['nuke', 'rain', 'flip', 'dome'];
const EVN = { wind: 'ريح', night: 'ليل', wet: 'ورقة مبلولة' };
const NUKE_R = 150, DOME_R = 160, RAIN_R = 22, LIGHT = 175, JIT = 14;
const INKS = [
  { id: 'blue', n: 'أزرق', c: '#1d4fd8' },
  { id: 'red', n: 'أحمر', c: '#c62828' },
  { id: 'green', n: 'أخضر', c: '#13804a' },
  { id: 'purple', n: 'بنفسجي', c: '#7b2fc9' },
  { id: 'orange', n: 'برتقالي', c: '#d8600b' },
  { id: 'black', n: 'أسود', c: '#1f2633' },
];
const inkOf = (id) => (INKS.find((i) => i.id === id) || INKS[0]).c;

const hyp = (x, y) => Math.sqrt(x * x + y * y);
const dist = (a, b, x, y) => hyp(a - x, b - y);
function segDist(x1, y1, x2, y2, px, py) {
  const dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy;
  let t = L ? ((px - x1) * dx + (py - y1) * dy) / L : 0;
  t = Math.max(0, Math.min(1, t));
  return hyp(px - (x1 + t * dx), py - (y1 + t * dy));
}

/* ---------- المناطق والطيّة ---------- */
const ZONES = {
  '1v1': [{ x: 0, y: 0, w: 800, h: 1000 }, { x: 800, y: 0, w: 800, h: 1000 }],
  '2v2': [{ x: 0, y: 0, w: 800, h: 500 }, { x: 800, y: 0, w: 800, h: 500 }, { x: 800, y: 500, w: 800, h: 500 }, { x: 0, y: 500, w: 800, h: 500 }],
};
const zoneOf = (mode, slot) => ZONES[mode][slot];
const teamOfSlot = (slot) => slot % 2;
const foldsOf = (mode) => (mode === '2v2' ? ['v', 'h'] : ['v']);
const fmap = (f, x, y) => (f === 'h' ? [x, PH - y] : [PW - x, y]);
const inRect = (z, x, y, m = 0) => x >= z.x + m && x <= z.x + z.w - m && y >= z.y + m && y <= z.y + z.h - m;
const clampRect = (z, x, y, m = 0) => [Math.min(z.x + z.w - m, Math.max(z.x + m, x)), Math.min(z.y + z.h - m, Math.max(z.y + m, y))];
function slotAt(mode, x, y) {
  const zs = ZONES[mode];
  for (let i = 0; i < zs.length; i++) if (inRect(zs[i], x, y)) return i;
  return -1;
}
function targetSlot(mode, slot, f) {
  const z = zoneOf(mode, slot);
  const [x, y] = fmap(f, z.x + z.w / 2, z.y + z.h / 2);
  return slotAt(mode, x, y);
}

/* ---------- عشوائي ثابت (بيتخزن مع اللعبة) ---------- */
function rnd(G) {
  G.rs = (G.rs + 0x6D2B79F5) | 0;
  let t = G.rs;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rint = (G, n) => Math.floor(rnd(G) * n);
const rpick = (G, a) => a[rint(G, a.length)];
function rdisc(G, R) { const a = rnd(G) * Math.PI * 2, r = Math.sqrt(rnd(G)) * R; return [Math.cos(a) * r, Math.sin(a) * r]; }

/* ---------- الجيش ---------- */
function armyCost(a) { return UORDER.reduce((s, k) => s + ((a && a[k]) | 0) * UT[k].cost, 0); }
function armyOk(a, mode) {
  if (!a) return false;
  let att = 0;
  for (const k of UORDER) {
    const n = a[k] | 0;
    if (n < 0 || n > UT[k].max) return false;
    if (UT[k].att) att += n;
  }
  return att > 0 && armyCost(a) <= BUDGET[mode];
}
function defaultArmy(mode) { return mode === '2v2' ? { s: 4, t: 1, p: 0, a: 1, m: 0 } : { s: 6, t: 1, p: 1, a: 0, m: 1 }; }
function randomArmy(mode, R) {
  R = R || Math.random;
  const B = BUDGET[mode];
  for (let tries = 0; tries < 60; tries++) {
    const a = { s: 0, t: 0, p: 0, a: 0, m: 0 };
    let left = B;
    const order = ['p', 't', 'a', 'm'].sort(() => R() - 0.5);
    for (const k of order) if (R() < 0.6 && left >= UT[k].cost && a[k] < UT[k].max) { a[k]++; left -= UT[k].cost; }
    while (left >= 5 && a.s < UT.s.max) { a.s++; left -= 5; }
    if (armyOk(a, mode) && armyCost(a) >= B - 10) return a;
  }
  return defaultArmy(mode);
}
function armyList(a) { const out = []; for (const k of UORDER) for (let i = 0; i < ((a && a[k]) | 0); i++) out.push(k); return out; }

/* ---------- الترتيب ---------- */
function spotOk(z, list, t, x, y, skip) {
  const r = UT[t].r;
  if (!inRect(z, x, y, r + 10)) return false;
  for (let i = 0; i < list.length; i++) {
    if (i === skip) continue;
    const q = list[i];
    if (dist(q[1], q[2], x, y) < (UT[q[0]].r + r) * 0.9 + 6) return false;
  }
  return true;
}
function placeOk(mode, slot, army, place) {
  if (!Array.isArray(place)) return false;
  const want = armyList(army).sort().join('');
  if (place.map((q) => q[0]).sort().join('') !== want) return false;
  const z = zoneOf(mode, slot);
  return place.every((q, i) => spotOk(z, place, q[0], q[1], q[2], i));
}
function autoPlace(mode, slot, army, R) {
  R = R || Math.random;
  const z = zoneOf(mode, slot);
  for (let attempt = 0; attempt < 40; attempt++) {
    const out = [];
    let ok = true;
    for (const t of armyList(army).sort((a, b) => UT[b].r - UT[a].r)) {
      let placed = false;
      for (let i = 0; i < 300 && !placed; i++) {
        const x = z.x + R() * z.w, y = z.y + R() * z.h;
        if (spotOk(z, out, t, x, y, -1)) { out.push([t, Math.round(x), Math.round(y)]); placed = true; }
      }
      if (!placed) { ok = false; break; }
    }
    if (ok) return out;
  }
  return null;
}

/* ---------- الحالة ---------- */
function newState(code, seed) {
  return {
    v: 1, code, phase: 'lobby', mode: '1v1', timer: 30, voice: 1,
    players: [], units: [], blots: [], domes: [], crates: [], nukes: [],
    ev: null, nextEv: null, evGap: 0, folds: { v: 0, h: 0 },
    turnNo: 0, round: 0, cur: -1, order: [], win: null, uid: 1,
    rs: seed | 0 || ((Math.random() * 2 ** 31) | 0),
  };
}
const PL = (G, id) => G.players.find((p) => p.id === id);
const curP = (G) => PL(G, G.order[G.cur]);
const unitsOf = (G, id) => G.units.filter((u) => u.o === id);
const aliveOf = (G, id) => G.units.filter((u) => u.o === id && u.al);
const enemyOf = (G, a, b) => { const A = PL(G, a), B = PL(G, b); return A && B && A.team !== B.team; };

function newPlayer(id, name, ink, bot) {
  return { id, name, ink, team: 0, slot: 0, bot: !!bot, army: null, place: null, ready: 0, rage: 0, rageN: 0, pw: [], flip: 0, out: 0, st: { shots: 0, hits: 0, kills: 0, lost: 0, best: 0, ff: 0 } };
}
function resetForMatch(G) {
  G.units = []; G.blots = []; G.domes = []; G.crates = []; G.nukes = [];
  G.ev = null; G.nextEv = null; G.evGap = 0; G.folds = { v: 0, h: 0 };
  G.turnNo = 0; G.round = 0; G.cur = -1; G.win = null;
  for (const p of G.players) Object.assign(p, { army: null, place: null, ready: 0, rage: 0, rageN: 0, pw: [], flip: 0, out: 0, st: { shots: 0, hits: 0, kills: 0, lost: 0, best: 0, ff: 0 } });
}
function assignSlots(G) {
  if (G.mode === '1v1') {
    G.players.forEach((p, i) => { p.slot = i; p.team = i; });
  } else {
    const A = G.players.filter((p) => p.team === 0), B = G.players.filter((p) => p.team === 1);
    A.forEach((p, i) => { p.slot = i * 2; });
    B.forEach((p, i) => { p.slot = i * 2 + 1; });
  }
  G.order = G.players.slice().sort((a, b) => a.slot - b.slot).map((p) => p.id);
}
function buildUnits(G) {
  G.units = [];
  for (const p of G.players) {
    for (const q of p.place) {
      const t = q[0];
      const u = { id: G.uid++, o: p.id, t, x: q[1], y: q[2], al: 1, cd: UT[t].cd0, sd: rint(G, 1e6) };
      if (t === 'p') u.h = rnd(G) * Math.PI * 2;
      G.units.push(u);
    }
  }
}

/* ---------- الأرض المحروقة والقبب ---------- */
function blotDist(b, x, y) { return b.k === 'l' ? segDist(b.x, b.y, b.x2, b.y2, x, y) : dist(b.x, b.y, x, y); }
function burnedAt(G, x, y, pad) {
  for (const b of G.blots) {
    if (blotDist(b, x, y) < b.r * 0.9 + pad) {
      if (b.cl && b.cl.some((c) => dist(c[0], c[1], x, y) < c[2])) continue;
      return true;
    }
  }
  return false;
}
const domed = (G, x, y) => G.domes.some((d) => dist(d.x, d.y, x, y) < d.r - 4);

function moveOk(G, P, u, x, y) {
  const t = UT[u.t];
  if (!u || u.o !== P.id || !u.al || !t.mv) return false;
  if (dist(u.x, u.y, x, y) > t.mv + 2) return false;
  const z = zoneOf(G.mode, P.slot);
  if (!inRect(z, x, y, t.r + 6)) return false;
  if (burnedAt(G, x, y, t.r * 0.4)) return false;
  for (const v of G.units) if (v !== u && v.al && v.o === P.id && v.t !== 'p' && dist(v.x, v.y, x, y) < (UT[v.t].r + t.r) * 0.85) return false;
  return true;
}

/* ---------- الطباعة والإصابة ---------- */
function addRage(P, v) {
  if (!P || P.rage >= 100) return;
  P.rage = Math.min(100, P.rage + v);
  if (P.rage >= 100) P.rageN++;
}
function grantPower(G, P) {
  const k = rpick(G, POWS);
  if (P.pw.length < 2) { P.pw.push(k); return k; }
  addRage(P, 50);
  return null;
}
function printBlot(G, b, owner) {
  b.id = G.uid++; b.o = owner; b.sd = rint(G, 1e6); b.tn = G.turnNo;
  const cl = G.domes.filter((d) => blotDist(b, d.x, d.y) < b.r + d.r).map((d) => [d.x, d.y, d.r]);
  if (cl.length) b.cl = cl;
  for (const k of ['x', 'y', 'x2', 'y2', 'r']) if (b[k] != null) b[k] = Math.round(b[k]);
  G.blots.push(b);
  const hits = [], got = [];
  for (const u of G.units) {
    if (!u.al || domed(G, u.x, u.y)) continue;
    if (blotDist(b, u.x, u.y) < b.r + UT[u.t].r * 0.5) { u.al = 0; u.dt = G.turnNo; hits.push(u.id); }
  }
  G.crates = G.crates.filter((c) => {
    if (blotDist(b, c.x, c.y) < b.r + 20 && !domed(G, c.x, c.y)) { got.push({ id: c.id, k: grantPower(G, PL(G, owner)) }); return false; }
    return true;
  });
  return { hits, got };
}
function scoreHits(G, shooter, hits) {
  let ek = 0;
  for (const id of hits) {
    const u = G.units.find((v) => v.id === id);
    const V = PL(G, u.o);
    if (V) { V.st.lost++; addRage(V, 25); }
    if (shooter && V && V.team !== shooter.team) { ek++; shooter.st.kills++; addRage(shooter, 20); }
    else if (shooter && V) shooter.st.ff++;
  }
  return ek;
}

/* ---------- الدور ---------- */
function folds(G) { return foldsOf(G.mode); }
function readyOf(G, P, t) { return aliveOf(G, P.id).filter((u) => u.t === t && u.cd === 0); }
function canShoot(G, P) { return aliveOf(G, P.id).some((u) => UT[u.t].att && u.cd === 0); }

function startMatch(G) {
  buildUnits(G);
  G.phase = 'turn'; G.cur = -1; G.turnNo = 0; G.round = 0;
  for (const p of G.players) p.out = aliveOf(G, p.id).length ? 0 : 1;
}

function newRound(G, fx) {
  G.round++;
  if (G.ev) {
    G.ev.left--;
    if (G.ev.left <= 0) { fx.push({ t: 'evEnd', k: G.ev.k }); G.ev = null; G.evGap = 2; }
  }
  if (G.nextEv) {
    G.ev = Object.assign({}, G.nextEv, { left: 2 });
    G.nextEv = null;
    fx.push({ t: 'ev', k: G.ev.k, a: G.ev.a });
  } else if (!G.ev && G.round >= 3) {
    if (G.evGap > 0) G.evGap--;
    else if (rnd(G) < 0.4) {
      const k = rpick(G, ['wind', 'night', 'wet']);
      const ev = { k };
      if (k === 'wind') { ev.a = rint(G, 8); ev.dx = Math.round(Math.cos(ev.a * Math.PI / 4) * 85); ev.dy = Math.round(Math.sin(ev.a * Math.PI / 4) * 85); }
      G.nextEv = ev;
      fx.push({ t: 'evAnn', k, a: ev.a });
    }
  }
  if (G.round >= 3 && (G.round - 3) % 4 === 0) spawnCrates(G, fx);
  if (G.round > 40) endByPoints(G, fx);
}
function freeSpot(G, z, near, minR, maxR, clear) {
  for (let i = 0; i < 200; i++) {
    let x, y;
    if (near) { const a = rnd(G) * Math.PI * 2, r = minR + rnd(G) * (maxR - minR); x = near[0] + Math.cos(a) * r; y = near[1] + Math.sin(a) * r; }
    else { x = z.x + rnd(G) * z.w; y = z.y + rnd(G) * z.h; }
    if (!inRect(z, x, y, 50)) continue;
    if (burnedAt(G, x, y, 20)) continue;
    if (G.units.some((u) => u.al && dist(u.x, u.y, x, y) < clear)) continue;
    if (G.crates.some((c) => dist(c.x, c.y, x, y) < 80)) continue;
    return [Math.round(x), Math.round(y)];
  }
  return null;
}
function spawnCrates(G, fx) {
  const ids = [];
  for (const team of [0, 1]) {
    const slots = G.players.filter((p) => p.team === team).map((p) => p.slot);
    const opts = slots.filter((s) => !G.crates.some((c) => slotAt(G.mode, c.x, c.y) === s));
    if (!opts.length) continue;
    const s = rpick(G, opts);
    const sp = freeSpot(G, zoneOf(G.mode, s), null, 0, 0, 90);
    if (!sp) continue;
    const c = { id: G.uid++, x: sp[0], y: sp[1] };
    G.crates.push(c); ids.push(c.id);
  }
  if (ids.length) fx.push({ t: 'crates', ids });
}

function nextTurn(G) {
  const fx = [];
  if (G.phase === 'over') return fx;
  let guard = 0;
  do {
    G.cur = (G.cur + 1) % G.order.length;
    if (G.cur === 0) newRound(G, fx);
    guard++;
  } while (G.phase !== 'over' && curP(G).out && guard < 12);
  if (G.phase === 'over') return fx;
  G.turnNo++;
  turnStart(G, curP(G), fx);
  if (G.phase !== 'over') G.phase = 'turn';
  return fx;
}

function turnStart(G, P, fx) {
  const mine = aliveOf(G, P.id);
  for (const u of mine) if (u.cd > 0) u.cd--;
  // القبب
  G.domes = G.domes.filter((d) => {
    if (d.o !== P.id) return true;
    d.left--;
    if (d.left <= 0) { fx.push({ t: 'domeEnd', d: d.id }); return false; }
    return true;
  });
  // الطيارات بتطير لحالها
  const z = zoneOf(G.mode, P.slot);
  const moves = [];
  for (const u of mine.filter((v) => v.t === 'p')) {
    const from = [u.x, u.y], h0 = u.h;
    let h = u.h + (rnd(G) - 0.5) * 1.0, x, y, n = 0;
    do {

      const lx = s.x - half.x, ly = s.y - half.y;
      if (f.f === 'h') { m.x = s.x - half.x; m.y = half.h - ly; if (s.k === 'l') { m.x2 = s.x2 - half.x; m.y2 = half.h - (s.y2 - half.y); } }

      ART.drawBlot(bc, m, color, k, { alpha: 0.22, noClip: true });
    }
    const horiz = f.f === 'h';
    const rotAxis = horiz ? 'rotateX' : 'rotateY';
    back.style.transform = rotAxis + '(180deg)';
    const shF = h('div', { class: 'shade', style: 'background:linear-gradient(' + (horiz ? (half.side === 'top' ? '0deg' : '180deg') : (half.side === 'left' ? '270deg' : '90deg')) + ',rgba(40,25,5,.55),rgba(40,25,5,0))' });
    const shB = h('div', { class: 'shade', style: 'transform:' + rotAxis + '(180deg);background:rgba(40,25,5,.22)' });
    flap.append(front, shF, back, shB);
    const origin = horiz ? (half.side === 'top' ? '50% 100%' : '50% 0%') : (half.side === 'left' ? '100% 50%' : '0% 50%');
    const sign = horiz ? (half.side === 'top' ? -1 : 1) : (half.side === 'left' ? 1 : -1);
    flap.style.transformOrigin = origin;
    ui.wrap.append(flap);
    anim.src = null;
    anim.clear = half;
    shadowsFor(half, true);
    redraw();
    AUD.sfx.fold();
    const dur = 900;
    const a1 = flap.animate([{ transform: `${rotAxis}(0deg)` }, { transform: `${rotAxis}(${sign * 90}deg) translateZ(0)`, offset: 0.5 }, { transform: `${rotAxis}(${sign * 180}deg)` }], { duration: dur, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'forwards' });
    shF.animate([{ opacity: 0 }, { opacity: 0.85 }, { opacity: 0.85 }], { duration: dur, fill: 'forwards' });
    shB.animate([{ opacity: 1 }, { opacity: 0.6 }, { opacity: 0 }], { duration: dur, fill: 'forwards' });
    await Promise.race([a1.finished, sleep(dur + 400)]);
    // 3) ضغطة
    AUD.sfx.press(); shake();
    flap.animate([{ transform: `${rotAxis}(${sign * 180}deg) scale(1)` }, { transform: `${rotAxis}(${sign * 180}deg) scale(.985)` }, { transform: `${rotAxis}(${sign * 180}deg) scale(1)` }], { duration: 260, fill: 'forwards' });
    // الطبعة تحت الورقة
    const newB = f.dst.map((id) => G.blots.find((b) => b.id === id)).filter(Boolean);
    for (const b of newB) D.blots.push(JSON.parse(JSON.stringify(b)));
    anim.fresh = new Map(newB.map((b) => [b.id, 1]));
    if (f.flip) { AUD.sfx.whoosh(); banner('🔄 انقلبت الورقة!', 'الضربة رجعت على صاحبها 😂', color, 1700); }
    AUD.sfx.roll(0.5);
    redraw();
    await sleep(f.flip ? 900 : 560);
    // 4) نفتح
    AUD.sfx.unfold();
    const a2 = flap.animate([{ transform: `${rotAxis}(${sign * 180}deg)` }, { transform: `${rotAxis}(${sign * 90}deg)`, offset: 0.5 }, { transform: `${rotAxis}(0deg)` }], { duration: 850, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'forwards' });
    shF.animate([{ opacity: 0.85 }, { opacity: 0.85 }, { opacity: 0 }], { duration: 850, fill: 'forwards' });
    shB.animate([{ opacity: 0 }, { opacity: 0.6 }, { opacity: 1 }], { duration: 850, fill: 'forwards' });
    await Promise.race([a2.finished, sleep(1250)]);
    anim.clear = null;
    if (!f.flip) anim.src = f.src.map((s) => Object.assign({}, s, { color, a: 1, sc: 1, sd: 3 + s.x }));
    shadowsFor(half, false);
    redraw();
    flap.remove();
    // 5) شو صار؟
    const gotP = f.got.length;
    const killP = killUnits(f.hits, color);
    const sm = anim.src;
    if (sm && !f.flip) tween(650, (p) => { for (const s of sm) s.a = 1 - p; }).then(() => { if (anim.src === sm) anim.src = null; });
    for (const g of f.got) {
      const c = D.crates.find((x) => x.id === g.id);
      if (c) { floatAt(c.x, c.y - 30, g.k ? '📦 ' + POW[g.k].n : '📦 +٥٠ غضب', color, 1.9); D.crates = D.crates.filter((x) => x.id !== g.id); }
    }
    if (gotP) setTimeout(() => AUD.sfx.crate(), 300);
    say(gotP && !f.hits.length ? pickLine('crate') : hitLine(f));
    await killP;
    const fm = anim.fresh;

  }

    if (screen.startsWith('army') && ui.armyTimer && S) ui.armyTimer.textContent = AR(Math.ceil(left() / 1000));
  }
  return { joinForm, connect, get S() { return S; } };
})();

/* ================= البداية ================= */
const MAIN = (() => {
  function home() {
    document.body.classList.remove('needland');
    const sv = ls.get('inkwar.save', null);
    const canResume = sv && sv.G && sv.G.phase !== 'lobby' && sv.G.phase !== 'over' && Date.now() - sv.at < 6 * 3600e3;
    const jn = ls.get('inkwar.join', null);
    const canRejoin = jn && jn.code && Date.now() - (jn.at || 0) < 6 * 3600e3;
    const splat = h('canvas', { class: 'splat', width: 700, height: 300, 'aria-hidden': 'true' });
    const sheet = h('div', { class: 'sheet' },
      h('div', { class: 'doodles' }, h('img', { src: ART.iconURL('t', inkOf('blue'), 90), alt: '' }), h('img', { src: ART.iconURL('p', inkOf('red'), 70), alt: '', style: 'height:60px;transform:rotate(-30deg)' })),
      h('h1', { class: 'logo' }, splat, 'حرب الحبر'),
      h('p', { class: 'tag' }, 'ارسم جيشك… حط البقعة… اطوِ الورقة، وشوف وين طبعت!'),
      h('div', { class: 'row' },
        h('button', { class: 'btn big yel', onclick: () => { AUD.unlock(); keepAwake(); HOST.start(false); } }, '📺 الشاشة الكبيرة'),
        h('button', { class: 'btn big', onclick: () => { AUD.unlock(); PHONE.joinForm(); } }, '📱 أنا لاعب')),
      canResume ? h('div', { class: 'resume' }, h('button', { class: 'btn', onclick: () => { AUD.unlock(); keepAwake(); HOST.start(true); } }, `↩️ كمّل اللعبة اللي وقفت (${sv.G.code})`)) : null,
      canRejoin && !canResume ? h('div', { class: 'resume' }, h('button', { class: 'btn', onclick: () => { AUD.unlock(); goFull(); keepAwake(); PHONE.connect(jn.code, jn.name, jn.ink); } }, `↩️ ارجع للعبة (${jn.code}) باسم ${jn.name}`)) : null,
      h('p', { class: 'small', style: 'margin:16px 0 0' }, 'الشاشة الكبيرة على اللابتوب أو التلفزيون، وكل لاعب من جواله.'));
    $('#app').replaceChildren(h('div', { class: 'home' }, sheet));
    const c = splat.getContext('2d');
    const draw = () => {
      c.clearRect(0, 0, 700, 300);
      ART.drawBlot(c, { k: 'o', x: 470, y: 150, r: 120, sd: 77 }, '#e9d38a', 1, { alpha: 0.9 });
      ART.drawBlot(c, { k: 'o', x: 150, y: 190, r: 46, sd: 21 }, '#f1b9a8', 1, { alpha: 0.9 });
    };
    draw();
  }
  function boot() {
    let join = null;
    try { join = new URLSearchParams(location.search).get('join'); } catch (e) { /* */ }
    if (join) PHONE.joinForm(null, join.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4));
    else home();
  }
  return { home, boot };
})();
window.__ink = { HOST, PHONE, MAIN, AUD };
MAIN.boot();

}
</script>
